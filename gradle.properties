# Plugin identity. The build script reads these; edit here, not in build.gradle.kts.
pluginGroup = io.github.hhenson.hgl
pluginName = HGL
pluginVersion = 0.1.0

# IntelliJ Platform the plugin is compiled against. It depends only on
# com.intellij.modules.platform / .lang, so one build installs on CLion,
# PyCharm, RustRover and IntelliJ IDEA of the same platform generation.
platformVersion = 2026.2.3
pluginSinceBuild = 262

org.gradle.jvmargs = -Xmx2g
org.gradle.caching = true
org.gradle.configuration-cache = false
kotlin.stdlib.default.dependency = false
