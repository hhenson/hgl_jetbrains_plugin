# Plugin identity. The build script reads these; edit here, not in build.gradle.kts.
pluginGroup = io.github.hhenson.hgl
pluginName = HGL
pluginVersion = 0.1.0

# CLion release the plugin is compiled and tested against (see build.gradle.kts).
# The plugin depends only on com.intellij.modules.platform / .lang, so one
# build installs on CLion, PyCharm, RustRover and IntelliJ IDEA of the same
# platform generation. Override the download with -PplatformLocalPath=<IDE app>.
platformVersion = 2026.2
pluginSinceBuild = 262

org.gradle.jvmargs = -Xmx2g
org.gradle.caching = true
org.gradle.configuration-cache = false
kotlin.stdlib.default.dependency = false
