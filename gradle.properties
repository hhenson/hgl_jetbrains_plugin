# Plugin identity. The build script reads these; edit here, not in build.gradle.kts.
pluginGroup = io.github.hhenson.hgl
pluginName = HGL
pluginVersion = 0.8.0

# CLion release the plugin is compiled and tested against (see build.gradle.kts).
# The same build is tested and verified on RustRover.
# Override the download with -PplatformLocalPath=<CLion installation>.
platformVersion = 2026.2
pluginSinceBuild = 262

org.gradle.jvmargs = -Xmx2g
org.gradle.caching = true
org.gradle.configuration-cache = false
kotlin.stdlib.default.dependency = false
