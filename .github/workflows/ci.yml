name: Plugin
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-26.04
    env:
      CXX: g++-15
      HGL_HGRAPH_DEPS: ${{ github.workspace }}/.hgraph/deps
      HGL_HGRAPH_SDK: ${{ github.workspace }}/.hgraph/sdk
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check release guards and packaged Markdown notes
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: |
          tools/refresh_test_data.sh
          test -z "$(git status --porcelain -- src/test/testData/parser)"
      - uses: actions/checkout@v7
        with:
          repository: hhenson/hgl-compiler
          ref: d9c22dab1618f062adb7da024b0352105921c4df
          path: build/test-compiler
          submodules: recursive
          persist-credentials: false
      - uses: actions/cache@v6
        id: sdk
        with:
          path: .hgraph
          key: sdk-${{ runner.os }}-${{ runner.arch }}-ubuntu26-${{ hashFiles('build/test-compiler/HGRAPH_TAG', 'build/test-compiler/scripts/provision-hgraph-sdk.sh', 'build/test-compiler/scripts/hgraph-dependencies.sh') }}
      - uses: mamba-org/setup-micromamba@v3
        if: steps.sdk.outputs.cache-hit != 'true'
        with:
          micromamba-version: '2.10.0-0'
      - name: Build the hgraph SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        working-directory: build/test-compiler
        run: scripts/provision-hgraph-sdk.sh "$(cat HGRAPH_TAG)" "$HGL_HGRAPH_SDK"
      - name: Prepare the HGL test runner
        working-directory: build/test-compiler
        run: |
          echo "$HGL_HGRAPH_DEPS/bin" >> "$GITHUB_PATH"
          cargo build --locked --bin hgl
          echo "HGL_TEST_CLI=$PWD/target/debug/hgl" >> "$GITHUB_ENV"
      - name: Verify the compiler documentation fixture
        run: |
          python3 tools/refresh_doc_fixture.py build/test-compiler
          git diff --exit-code -- src/test/testData/documentation
      - run: ./gradlew prepareMarketplaceRelease
      - uses: actions/upload-artifact@v7
        with:
          name: hgl-plugin-zip
          path: build/marketplace/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hgl-test-reports
          path: |
            build/reports/tests/
            build/reports/pluginVerifier/
