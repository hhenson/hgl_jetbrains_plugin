name: Plugin
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Check release guards and packaged Markdown notes
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: |
          tools/refresh_test_data.sh
          test -z "$(git status --porcelain -- src/test/testData/parser)"
      - uses: actions/checkout@v7
        with:
          repository: hhenson/hgl-compiler
          ref: a7650d4f86850c8792fff62386a7b038c8ce49b9
          path: build/test-compiler
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Prepare the HGL test runner
        working-directory: build/test-compiler
        run: |
          python -m pip install hgraph==0.9.3
          cargo build --locked --bin hgl
          echo "HGL_TEST_CLI=$PWD/target/debug/hgl" >> "$GITHUB_ENV"
          echo "HGL_HGRAPH_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - run: ./gradlew prepareMarketplaceRelease
      - uses: actions/upload-artifact@v7
        with:
          name: hgl-plugin-zip
          path: build/marketplace/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hgl-test-reports
          path: |
            build/reports/tests/
            build/reports/pluginVerifier/
